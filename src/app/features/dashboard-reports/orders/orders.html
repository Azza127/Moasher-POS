<div class="container-fluid py-4" *ngIf="!loading(); else loadingTpl">
  <h2 class="mb-4">Orders</h2>

  <div class="btn-group mb-3">
    <button class="btn btn-outline-secondary" [class.active]="statusFilter()==='All'" (click)="setFilter('All')">All</button>
    <button class="btn btn-outline-secondary" [class.active]="statusFilter()==='Completed'" (click)="setFilter('Completed')">Completed</button>
    <button class="btn btn-outline-secondary" [class.active]="statusFilter()==='Pending'" (click)="setFilter('Pending')">Pending</button>
    <button class="btn btn-outline-secondary" [class.active]="statusFilter()==='Cancelled'" (click)="setFilter('Cancelled')">Cancelled</button>
  </div>

  <div class="card shadow-sm">
    <div class="table-responsive">
      <table class="table table-hover mb-0 align-middle">
        <thead class="table-light">
          <tr>
            <th>Order ID</th>
            <th>Date</th>
            <th>Total</th>
            <th>Payment Method</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let order of filteredOrders()">
            <td>#ORD-{{ order.id }}</td>
            <td>{{ order.createdAt | date: 'medium' }}</td>
            <td>{{ order.total | currency }}</td>
            <td class="text-capitalize">{{ order.paymentMethod }}</td>
            <td>
              <span class="badge"
                    [class.bg-success]="order.status === 'Completed'"
                    [class.bg-warning]="order.status === 'Pending'"
                    [class.bg-danger]="order.status === 'Cancelled'">
                {{ order.status }}
              </span>
            </td>
          </tr>
          <tr *ngIf="!filteredOrders().length">
            <td colspan="5" class="text-center text-muted py-3">No orders found.</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<ng-template #loadingTpl>
  <div class="d-flex justify-content-center align-items-center" style="height: 300px;">
    <div class="spinner-border text-primary" role="status"></div>
  </div>
</ng-template>
